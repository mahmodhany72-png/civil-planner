<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil Engineer Planner</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  overflow:auto;
  transition: background 0.5s ease;
}

.background{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(-45deg,#1e3c72,#2a5298,#00c6ff,#0072ff);
  background-size:400% 400%;
  animation:gradient 8s ease infinite;
  z-index:-2;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.engineer{
  position:fixed;
  bottom:30px;
  right:30px;
  font-size:70px;
  animation:float 3s ease-in-out infinite;
  z-index:2;
}

#signature{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:20px;
  color:rgba(255,255,255,0.3);
  z-index:1;
  pointer-events:none;
}

.screen{
  display:none;
  padding:20px;
  transition: background 0.5s ease;
}

.active{
  display:block;
}

button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  background:#00000088;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.card{
  background:#00000066;
  padding:15px;
  border-radius:15px;
  margin:10px 0;
}

.subject{
  color:#FFD700;
  font-size:18px;
}

.sheet{
  color:#00FFFF;
  cursor:pointer;
  transition: color 0.3s ease, transform 0.2s ease;
}

.sheet:hover{
  color:#FF69B4;
  transform:scale(1.05);
}

.date{
  color:#00FFAA;
  margin-top:10px;
  font-weight:bold;
}

.note-content{
  white-space: pre-wrap;
  margin-top:5px;
  padding:5px;
  background:#00000044;
  border-radius:8px;
  outline:none;
}

.pdf-preview{
  width:100%;
  height:300px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #fff;
}

.new-buttons{
  display:flex;
  gap:10px;
  margin:10px 0;
}

.new-buttons button{
  flex:1;
}
</style>
</head>

<body>

<div class="background"></div>
<div id="signature">BY: Mahmoud Hany</div>
<div class="engineer">👷‍♂️</div>

<!-- Home -->
<div id="home" class="screen active">
<h1>Civil Engineer Planner 👷‍♂️</h1>
<button onclick="openSection('subjects')">Subjects</button>
<button onclick="enterLeaderPassword()">Enter Password</button>
</div>

<!-- Subjects -->
<div id="subjects" class="screen">
<button onclick="openSection('home')">Back</button>

<div class="card">
  <div class="subject">STEEL II</div>
  <div class="sheet" onclick="openSheet('steel2')">Open Sheet</div>
</div>

<div class="card">
  <div class="subject">R.C.C II</div>
  <div class="sheet" onclick="openSheet('rcc2')">Open Sheet</div>
</div>

<div class="card">
  <div class="subject">ENGINEERING ECONOMICS</div>
  <div class="sheet" onclick="openSheet('economics')">Open Sheet</div>
</div>

<div class="card">
  <div class="subject">CONSTRUCTION ENGINEERING II</div>
  <div class="sheet" onclick="openSheet('construction2')">Open Sheet</div>
</div>

<div class="card">
  <div class="subject">FOUNDATION I</div>
  <div class="sheet" onclick="openSheet('foundation1')">Open Sheet</div>
</div>

<div class="card">
  <div class="subject">MASONRY STRUCTURES I</div>
  <div class="sheet" onclick="openSheet('masonry1')">Open Sheet</div>
</div>
</div>

<!-- Sheet Page -->
<div id="sheetPage" class="screen">
<button onclick="openSection('subjects')">Back</button>

<div class="new-buttons">
  <button onclick="addNewText()">New Text</button>
  <button onclick="addNewPDF()">New PDF</button>
</div>

<div id="list"></div>
</div>

<script>
let currentSubject="";
const leaderPassword="m16"; 
let isLeader=false; 

// كلمة السر دائمة مخزنة
if(localStorage.getItem("isLeader")==="true") isLeader=true;

function openSection(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.body.style.background="linear-gradient(-45deg,#1e3c72,#2a5298,#00c6ff,#0072ff)";
}

function openSheet(subject){
  currentSubject=subject;
  loadData();
  // تغيير لون الخلفية عند فتح sheet
  document.body.style.background="#1a1a1a";
  openSection("sheetPage");
}

function enterLeaderPassword(){
  const pass = prompt("Enter password to become Leader:");
  if(pass===leaderPassword){
    isLeader=true;
    localStorage.setItem("isLeader","true");
    alert("Leader mode activated! You can now write and add content.");
    loadData();
  } else {
    alert("Wrong password!");
  }
}

function getDate(){
  let d=new Date();
  return d.toLocaleDateString();
}

function askPassword(){
  if(isLeader) return true;
  const pass=prompt("Enter password to write/edit:");
  if(pass===leaderPassword){
    isLeader=true;
    localStorage.setItem("isLeader","true");
    alert("You can now write and add content!");
    loadData();
    return true;
  } else {
    alert("Wrong password!");
    return false;
  }
}

function addNewText(){
  if(!askPassword()) return;
  const date=getDate();
  let data=JSON.parse(localStorage.getItem(currentSubject)||"{}");
  if(!data[date]) data[date]=[];
  data[date].push({type:"text", content:""});
  localStorage.setItem(currentSubject,JSON.stringify(data));
  loadData();
}

function addNewPDF(){
  if(!askPassword()) return;
  const input=document.createElement("input");
  input.type="file";
  input.accept="application/pdf";
  input.onchange=savePDF;
  input.click();
}

function savePDF(e){
  if(!askPassword()) return;
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){alert("File too large! Max 5MB"); return;}
  const reader=new FileReader();
  reader.onload=function(){
    const date=getDate();
    let data=JSON.parse(localStorage.getItem(currentSubject)||"{}");
    if(!data[date]) data[date]=[];
    data[date].push({type:"pdf", name:file.name, url:reader.result});
    localStorage.setItem(currentSubject,JSON.stringify(data));
    loadData();
  };
  reader.readAsDataURL(file);
}

function deleteItem(date,index){
  if(!askPassword()) return;
  let data=JSON.parse(localStorage.getItem(currentSubject));
  data[date].splice(index,1);
  if(data[date].length===0) delete data[date];
  localStorage.setItem(currentSubject,JSON.stringify(data));
  loadData();
}

function loadData(){
  const list=document.getElementById("list");
  const newButtons=document.querySelector(".new-buttons");
  newButtons.style.display=isLeader ? "flex" : "none";
  list.innerHTML="";
  let data=JSON.parse(localStorage.getItem(currentSubject)||"{}");
  for(let date in data){
    list.innerHTML+=`<div class="date">${date}</div>`;
    data[date].forEach((item,i)=>{
      if(item.type==="pdf"){
        list.innerHTML+=`
        <div>
          <div>
            <strong>${item.name}</strong>
            ${isLeader?`<button style="float:right;" onclick="deleteItem('${date}',${i})">X</button>`:""}
          </div>
          <embed class="pdf-preview" src="${item.url}" type="application/pdf"/>
        </div>`;
      } else {
        list.innerHTML+=`
        <div>
          <div class="note-content" contenteditable="${isLeader}" 
            ${isLeader?`oninput="autoSave(this,'${date}',${i})" onkeydown="checkDelete(event,'${date}',${i})"`:""}>
            ${item.content}
          </div>
        </div>`;
      }
    });
  }
}

function autoSave(element,date,index){
  if(!askPassword()) return;
  let data=JSON.parse(localStorage.getItem(currentSubject));
  data[date][index].content=element.innerText;
  localStorage.setItem(currentSubject,JSON.stringify(data));
}

function checkDelete(e,date,index){
  if(!askPassword()) return;
  if(e.key==="Backspace" && e.target.innerText.trim()===""){
    deleteItem(date,index);
  }
}
</script>

</body>
</html>
