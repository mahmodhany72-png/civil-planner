<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil Engineer Planner</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
overflow:hidden;
}

/* Animated Background */
.background{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(-45deg,#1e3c72,#2a5298,#00c6ff,#0072ff);
background-size:400% 400%;
animation:gradient 8s ease infinite;
z-index:-1;
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Floating Engineer Emoji */
.engineer{
position:fixed;
bottom:30px;
right:30px;
font-size:70px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-20px);}
}

.screen{
display:none;
padding:20px;
}

.active{
display:block;
}

button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#00000088;
color:white;
font-size:16px;
cursor:pointer;
}

.card{
background:#00000066;
padding:15px;
border-radius:15px;
margin:10px 0;
}

.subject{
color:#FFD700;
font-size:18px;
}

.sheet{
color:#00FFFF;
cursor:pointer;
}

.date{
color:#00FFAA;
margin-top:10px;
font-weight:bold;
}

textarea{
width:100%;
height:80px;
margin-top:10px;
border-radius:10px;
padding:10px;
}

.delete{
background:red;
padding:5px;
margin-left:10px;
}

</style>
</head>

<body>

<div class="background"></div>
<div class="engineer">👷‍♂️</div>

<!-- Home -->
<div id="home" class="screen active">

<h1>Civil Engineer Planner 👷‍♂️</h1>

<button onclick="openSection('subjects')">
Subjects
</button>

</div>

<!-- Subjects -->
<div id="subjects" class="screen">

<button onclick="openSection('home')">
Back
</button>

<div class="card">
<div class="subject">Steel Structures Design 2</div>
<div class="sheet" onclick="openSheet('steel')">Open Sheet</div>
</div>

<div class="card">
<div class="subject">Engineering Economics</div>
<div class="sheet" onclick="openSheet('economics')">Open Sheet</div>
</div>

<div class="card">
<div class="subject">Construction Engineering</div>
<div class="sheet" onclick="openSheet('construction')">Open Sheet</div>
</div>

<div class="card">
<div class="subject">Concrete Structures Design</div>
<div class="sheet" onclick="openSheet('concrete')">Open Sheet</div>
</div>

<div class="card">
<div class="subject">Brick Structures Design</div>
<div class="sheet" onclick="openSheet('brick')">Open Sheet</div>
</div>

</div>

<!-- Sheet Page -->
<div id="sheetPage" class="screen">

<button onclick="openSection('subjects')">
Back
</button>

<input type="file" accept="application/pdf" onchange="savePDF(event)">

<textarea id="text"></textarea>

<button onclick="saveText()">Save</button>

<div id="list"></div>

</div>

<script>

let currentSubject="";

function openSection(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}

function openSheet(subject){

currentSubject=subject;

openSection("sheetPage");

loadData();

}

function getDate(){

let d=new Date();

return d.toLocaleDateString();

}

function savePDF(e){

let file=e.target.files[0];

let reader=new FileReader();

reader.onload=function(){

let data=JSON.parse(localStorage.getItem(currentSubject)||"{}");

let date=getDate();

if(!data[date])data[date]=[];

data[date].push({

type:"pdf",

name:file.name,

url:reader.result

});

localStorage.setItem(currentSubject,JSON.stringify(data));

loadData();

};

reader.readAsDataURL(file);

}

function saveText(){

let text=document.getElementById("text").value;

let data=JSON.parse(localStorage.getItem(currentSubject)||"{}");

let date=getDate();

if(!data[date])data[date]=[];

data[date].push({

type:"text",

content:text

});

localStorage.setItem(currentSubject,JSON.stringify(data));

document.getElementById("text").value="";

loadData();

}

function deleteItem(date,index){

let data=JSON.parse(localStorage.getItem(currentSubject));

data[date].splice(index,1);

localStorage.setItem(currentSubject,JSON.stringify(data));

loadData();

}

function loadData(){

let list=document.getElementById("list");

list.innerHTML="";

let data=JSON.parse(localStorage.getItem(currentSubject)||"{}");

for(let date in data){

list.innerHTML+=`<div class="date">${date}</div>`;

data[date].forEach((item,i)=>{

if(item.type=="pdf"){

list.innerHTML+=`
<div>
<a href="${item.url}" target="_blank">${item.name}</a>
<button class="delete" onclick="deleteItem('${date}',${i})">
Delete
</button>
</div>
`;

}else{

list.innerHTML+=`
<div>
${item.content}
<button class="delete" onclick="deleteItem('${date}',${i})">
Delete
</button>
</div>
`;

}

});

}

}

</script>

</body>
</html>
