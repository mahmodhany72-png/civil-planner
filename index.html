<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>رسالة خاصة ❤️</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}body{margin:0;background:linear-gradient(135deg,#ff9ecf,#ffd6e8);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.card{background:#fff;padding:30px;border-radius:20px;max-width:650px;width:92%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.2)}
.hidden{display:none}button{padding:12px 24px;border:none;border-radius:30px;margin:8px;cursor:pointer;font-size:18px}h1{color:#ff2d75}#no,#no2{position:absolute;background:#555;color:#fff}#yes,#yes2,#start,#next,#next2,#lastBtn{background:#ff2d75;color:#fff}
#message{font-size:28px;line-height:1.8}.heart{position:fixed;animation:fly 5s linear forwards}@keyframes fly{to{transform:translateY(-110vh) scale(2);opacity:0}}
</style></head><body>
<div class="card">
<h1>❤️ رسالة خاصة ❤️</h1>
<div id="p1"><p>استني ثانية... عندي سؤال مهم جدًا ❤️</p><button id="start">جاهزة؟</button></div>
<div id="p2" class="hidden"><p>بتحبيني؟ 🥹</p><button id="yes">❤️ آه</button><button id="no">💔 لأ</button></div>
<div id="p3" class="hidden"><h1 id="message"></h1></div>
<div id="p4" class="hidden"><h2>❤️ 20 / 6 ❤️</h2><p>ده اليوم اللي أنا حبيتك فيه.</p><button id="next2">كملي ❤️</button></div>
<div id="p5" class="hidden"><p>طب قوليلي... زهقتي؟ 🥺</p><button id="yes2">❤️ لأ</button><button id="no2">💔 آه</button></div>
<div id="p6" class="hidden"><p id="long"></p></div>
<div id="p7" class="hidden"><h2>إيه ده 😏</h2><p>هو انتي فاكرة إني خلصت كده؟<br>لسه عندي كلام كتير نفسي أقولهولك ❤️</p><button id="lastBtn">💌 افتحي الرسالة الأخيرة</button></div>
<div id="p8" class="hidden"><p id="last"></p></div>
<div id="p9" class="hidden"><h1 style="font-size:48px">❤️ بحبك ❤️</h1><h3>Forever & Always ❤️</h3></div>
</div>
<script>
const $=id=>document.getElementById(id);
function show(a,b){$(a).classList.add("hidden");$(b).classList.remove("hidden")}
$("start").onclick=()=>{show("p1","p2");place("no")}
$("yes").onclick=()=>seq();
$("next2").onclick=()=>{show("p4","p5");place("no2")}
$("yes2").onclick=()=>{show("p5","p6");type("long","بصي يا عمري أنا يمكن معرفش أوصف كل اللي جوايا بالكلام بس كل اللي أعرفه إنك بقيتي أجمل حاجة في حياتي وإن وجودك بيفرق معايا في كل يوم أنا بفرح لما أشوف رسالة منك وببتسم من غير ما أحس لما أشوف اسمك نفسي أفضل جنبك على طول وأشوفك مبسوطة دايمًا وأكون السبب في ضحكتك أنا بحبك يا عمري ❤️",()=>show("p6","p7"))}
$("lastBtn").onclick=()=>{show("p7","p8");type("last","بحبك بكل لحظة وبكل نفس فيا بحبك بعيوني اللي مش بتشوف حد غيرك وبقلبي اللي من ساعة ما شافك وهو مش عايز حد غيرك بحبك بصوتك وبنظرتك وبطريقة كلامك بحبك في زعلك وفرحك وبحب حتى سكوتك بحبك ❤️",()=>{show("p8","p9");setInterval(heart,250)})}
function seq(){show("p2","p3");let arr=["❤️ يا عمري","🌹 يا روحي","💖 يا قلبي","🌙 يا قمري... بعشقك ❤️","🍓 يا فراولتي"],i=0;let t=setInterval(()=>{$("message").innerHTML=arr[i++];if(i==arr.length){clearInterval(t);setTimeout(()=>show("p3","p4"),1200)}},1000)}
function type(id,txt,cb){let i=0,e=$(id);let t=setInterval(()=>{e.textContent+=txt[i++]||"";if(i>txt.length){clearInterval(t);cb&&setTimeout(cb,1000)}},30)}
function place(id){let b=$(id);move(b);["mouseover","touchstart"].forEach(ev=>b.addEventListener(ev,()=>move(b)))}
function move(b){b.style.left=Math.random()*(innerWidth-120)+"px";b.style.top=Math.random()*(innerHeight-60)+"px";}
function heart(){let h=document.createElement("div");h.className="heart";h.textContent="❤️";h.style.left=Math.random()*innerWidth+"px";h.style.top=innerHeight+"px";h.style.fontSize=(20+Math.random()*30)+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),5000)}
</script></body></html>
